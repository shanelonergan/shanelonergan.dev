<!doctype html>
<html lang="en" data-theme="netscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve the theme before first paint: ?theme= → localStorage → netscape.
      ;(function () {
        var ids = ['netscape', 'geocities', 'macos9', 'myspace', 'today']
        var t = null
        try {
          t = new URLSearchParams(location.search).get('theme')
        } catch (e) {}
        if (ids.indexOf(t) >= 0) {
          try {
            localStorage.setItem('theme', t)
          } catch (e) {}
        } else {
          try {
            t = localStorage.getItem('theme')
          } catch (e) {}
        }
        if (ids.indexOf(t) < 0) t = 'netscape'
        document.documentElement.setAttribute('data-theme', t)
        // Non-default eras are lazy chunks. The build fills this map in, so the
        // chosen era's code and CSS start downloading now instead of after the
        // main bundle has run.
        var chunks = {} /*__THEME_CHUNKS__*/
        var c = chunks[t]
        if (c) {
          var add = function (rel, href, as) {
            var l = document.createElement('link')
            l.rel = rel
            l.href = href
            if (as) l.as = as
            document.head.appendChild(l)
          }
          add('modulepreload', c.js)
          for (var i = 0; i < c.css.length; i++) add('preload', c.css[i], 'style')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#c0c0c0" />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
