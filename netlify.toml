[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Hashed filenames, so these can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pages are prerendered as /projects.html etc. Fold trailing-slash variants onto them.
[[redirects]]
  from = "/projects/"
  to = "/projects"
  status = 301

[[redirects]]
  from = "/resume/"
  to = "/resume"
  status = 301

[[redirects]]
  from = "/bio/"
  to = "/bio"
  status = 301

# Hobbies was folded into the bio
[[redirects]]
  from = "/hobbies"
  to = "/bio"
  status = 301

[[redirects]]
  from = "/hobbies/"
  to = "/bio"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/contact"
  status = 301

# The old portfolio's routes, if anyone kept a link.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301
